name: Extract Roblox Studio place

on:
  push:
    branches:
      - "Visual-procces-haxball-(phase-6)"
    paths:
      - "hexballactual.rbxl"
      - ".github/workflows/extract-roblox-place.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-place:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Convert RBXL binary to RBXLX
        run: |
          cargo run --release --manifest-path tools/rbxl-convert/Cargo.toml -- hexballactual.rbxl "$RUNNER_TEMP/Roblox Hexball.rbxlx"
          test -s "$RUNNER_TEMP/Roblox Hexball.rbxlx"

      - name: Extract every instance and script
        run: |
          python tools/place.py export "$RUNNER_TEMP/Roblox Hexball.rbxlx"
          test -f src/place.json
          test -f docs/inventory.json

      - name: Rebuild a clean extracted-project branch
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/final-project"
          mkdir -p "$STAGE/src" "$STAGE/docs" "$STAGE/tools/rbxl-convert/src"

          cp -a src/. "$STAGE/src/"
          cp docs/inventory.json "$STAGE/docs/inventory.json"
          cp "$RUNNER_TEMP/Roblox Hexball.rbxlx" "$STAGE/Roblox Hexball.rbxlx"
          cp hexballactual.rbxl "$STAGE/hexballactual.rbxl"
          cp tools/place.py "$STAGE/tools/place.py"
          cp tools/rbxl-convert/Cargo.toml "$STAGE/tools/rbxl-convert/Cargo.toml"
          cp tools/rbxl-convert/src/main.rs "$STAGE/tools/rbxl-convert/src/main.rs"

          cat > "$STAGE/README.md" <<'EOF'
          # Roblox Hexball

          Proyecto extraído directamente de `hexballactual.rbxl`, el archivo binario original de Roblox Studio.

          ## Archivos

          - `hexballactual.rbxl`: archivo original, conservado sin modificaciones.
          - `Roblox Hexball.rbxlx`: conversión XML del mismo place.
          - `src/`: jerarquía extraída, con un `instance.json` por instancia y archivos Luau separados.
          - `docs/inventory.json`: inventario de instancias, clases, scripts y referents.
          - `tools/place.py`: exportación, reconstrucción y verificación de la estructura.
          - `tools/rbxl-convert/`: conversor de RBXL binario a RBXLX usando rbx-dom.

          ## Reconstruir el XML después de editar

          ```sh
          python tools/place.py build
          ```

          El resultado se genera en `build/Roblox-Hexball.rbxlx`.

          ## Volver a extraer desde el archivo binario original

          ```sh
          cargo run --release --manifest-path tools/rbxl-convert/Cargo.toml -- hexballactual.rbxl build/Roblox-Hexball.rbxlx
          python tools/place.py export build/Roblox-Hexball.rbxlx
          ```

          Los recursos externos se mantienen por sus referencias/IDs; no se descargan automáticamente.
          EOF

          cat > "$STAGE/.gitignore" <<'EOF'
          /build/
          /tools/rbxl-convert/target/
          __pycache__/
          EOF

          # Remove the inherited main/visual snapshot, then restore only the
          # original Studio file and the freshly extracted project.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$STAGE"/. .

          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Extract game project from hexballactual.rbxl"
          git push origin "HEAD:$GITHUB_REF_NAME"
