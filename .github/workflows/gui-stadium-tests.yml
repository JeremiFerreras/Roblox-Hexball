name: GUI 2D stadium tests

on:
  push:
    branches:
      - "Visual-procces-haxball-(phase-6)"
    paths:
      - "src/ReplicatedStorage/HaxballLab/GuiStadiumScene/**"
      - "src/ReplicatedStorage/HaxballLab/StadiumReference2D/**"
      - "src/ReplicatedStorage/HaxballLab/ClassicReference230/**"
      - "README.md"
      - "src/ReplicatedStorage/HaxballLab/GuiStadiumRenderer/**"
      - "src/ReplicatedStorage/HaxballLab/NetCodec/**"
      - "src/ReplicatedStorage/HaxballLab/RosterAllocator/**"
      - "src/ReplicatedStorage/HaxballLab/StadiumReference2D/**"
      - "src/ReplicatedStorage/HaxballLab/NetPrediction/**"
      - "src/ReplicatedStorage/HaxballLab/SnapshotBuffer/**"
      - "src/ReplicatedStorage/HaxballLab/LabClient/**"
      - "src/ServerScriptService/HaxballLab/LabServer/**"
      - "src/ServerScriptService/HaxballLab/NetServer/**"
      - "src/ServerScriptService/HaxballLab/MatchRules2D/**"
      - "src/ServerScriptService/HaxballLab/LabRegression/**"
      - "src/ReplicatedFirst/**"
      - "src/ServerScriptService/HaxballLab/ClassicStadium2D/**"
      - "src/ServerScriptService/HaxballLab/Physics2D/**"
      - "src/ReplicatedStorage/HaxballLab/PhysicsCore2D/**"
      - "src/ReplicatedStorage/Inputs/**"
      - "src/ServerScriptService/HaxballLab/instance.json"
      - "src/ReplicatedStorage/HaxballLab/instance.json"
      - "src/Workspace/HaxballLab/instance.json"
      - "tests/luau/**"
      - ".github/workflows/gui-stadium-tests.yml"
  pull_request:
    branches:
      - "Visual-procces-haxball-(phase-6)"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gui-stadium:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Luau CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/luau"
          curl -fsSL "https://github.com/luau-lang/luau/releases/download/0.748/luau-ubuntu.zip" -o "$RUNNER_TEMP/luau.zip"
          unzip -q "$RUNNER_TEMP/luau.zip" -d "$RUNNER_TEMP/luau"
          test -x "$RUNNER_TEMP/luau/luau"
          test -x "$RUNNER_TEMP/luau/luau-analyze"
          echo "$RUNNER_TEMP/luau" >> "$GITHUB_PATH"

      - name: Analyze pure Luau scene and tests
        run: |
          luau-analyze src/ReplicatedStorage/HaxballLab/GuiStadiumScene/init.luau

      - name: Reject legacy renderer, runtime path and branding references
        shell: bash
        run: |
          set -euo pipefail
          CLIENT="src/ReplicatedStorage/HaxballLab/LabClient/init.server.luau"
          if grep -nE 'predictionGhost|CurrentCamera|fitCamera|CFrame\.lookAt|Instance\.new\("Part"\)|playerDisc|ballDisc|geometryVisuals|renderLine' "$CLIENT"; then
            echo "Legacy 3D renderer reference remains in the live client"
            exit 1
          fi
          if grep -RniE 'Haxball|haxball|Node-' --include='*.luau' src/ReplicatedStorage/HaxballLab src/ServerScriptService/HaxballLab; then
            echo "Legacy game branding remains in runtime Luau sources"
            exit 1
          fi
          if grep -RniE 'WaitForChild\("HaxballLab"|\.HaxballLab' --include='*.luau' src/ReplicatedStorage src/ServerScriptService; then
            echo "Runtime still references the old ReplicatedStorage folder"
            exit 1
          fi

      - name: Verify client handshake and 4v4 invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          client = Path("src/ReplicatedStorage/HaxballLab/LabClient/init.server.luau").read_text()
          server = Path("src/ServerScriptService/HaxballLab/LabServer/init.server.luau").read_text()
          codec = Path("src/ReplicatedStorage/HaxballLab/NetCodec/init.luau").read_text()
          allocator = Path("src/ReplicatedStorage/HaxballLab/RosterAllocator/init.luau").read_text()
          profile = Path("src/ReplicatedStorage/HaxballLab/StadiumReference2D/init.luau").read_text()
          boot = Path("src/ReplicatedFirst/SimpleSoccerBoot/init.client.luau").read_text()
          for remote in ("snapshotRemote.OnClientEvent:Connect", "stateStream.OnClientEvent:Connect", "controlRemote.OnClientEvent:Connect"):
              assert remote in client, f"missing event listener: {remote}"
          assert client.index("snapshotRemote.OnClientEvent:Connect") < client.index("local NetCodec = require")
          assert client.index("stateStream.OnClientEvent:Connect") < client.index('WaitForChild("SimpleSoccerControls"')
          assert "SimpleSoccerControls" in client and "Simple SoccerGameplay" not in client
          assert client.index("stateStream.OnClientEvent:Connect") < client.index("GuiStadiumRenderer.new")
          assert client.index("controlRemote.OnClientEvent:Connect") < client.index("GuiStadiumRenderer.new")
          assert client.index("GuiStadiumRenderer.new") < client.index('controlRemote:FireServer("ready")')
          assert 'WaitForChild("Remotes"' in client and 'WaitForChild("Remotes"' in server
          assert "PlayerCount = 8" in profile and "PlayersPerTeam = 4" in profile
          assert "STATE_BYTES = 72 + 8 * 41" in codec and "4v4 state required" in codec
          assert "RosterAllocator.nextSlot" in client or "RosterAllocator.nextSlot" in server
          assert "two equal teams" in allocator
          assert "RunService.RenderStepped:Connect" in boot
          assert "task.wait(frameDuration)" not in boot
          assert "AspectRatio = 2.1" in boot
          assert 'Name = "Number"' in boot and "number.Parent = disc" in boot
          assert 'goalBanner.Visible = true' in boot and 'RED  1  :  0  BLUE' in boot
          print("PASS: early event listeners, correct input path, 4v4 roster and 400-byte codec")
          print("PASS: render-frame animation, wide pitch, attached numbers and completed goal")
          PY

      - name: Run headless scene, GUI and 4v4 network tests
        run: luau tests/luau/run-gui-stadium-tests.luau
