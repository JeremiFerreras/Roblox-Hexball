name: Phase 5 integrated checks

on:
  push:
    branches:
      - phase5/adaptive-buffer-work

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/offline/package-lock.json
      - run: npm ci --prefix tests/offline
      - name: Format and rebuild place plus inventory
        run: python work/phase5/prepare-ci.py
      - name: Source formatting
        run: |
          npm run format:check --prefix tests/offline
          npm run format:check:luau --prefix tests/offline
      - name: Regression network and actual client integration
        run: npm test --prefix tests/offline
      - name: Quality fuzz and mutation checks
        run: npm run test:quality --prefix tests/offline
      - name: Export validated workspace changes
        run: python work/phase5/export-ci.py
