name: Verify extracted Roblox place

on:
  push:
    branches:
      - "Visual-procces-haxball-(phase-6)"
    paths:
      - ".github/workflows/verify-clean-extraction.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check extraction inventory and exact folder coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          inventory = json.loads(Path("docs/inventory.json").read_text(encoding="utf-8"))
          expected = {
              Path(value) / "instance.json"
              for value in inventory["referents"].values()
          }
          actual = set(Path("src").rglob("instance.json"))
          assert inventory["instances"] == 561, inventory["instances"]
          assert len(inventory["scripts"]) == 25, len(inventory["scripts"])
          assert expected == actual, {
              "missing": sorted(str(p) for p in expected - actual),
              "stale": sorted(str(p) for p in actual - expected),
          }
          print(f"Inventory OK: {len(actual)} instances, {len(inventory['scripts'])} scripts")
          PY

      - name: Verify full XML round-trip
        run: python tools/place.py verify

      - name: Remove temporary verification workflow
        run: |
          git rm .github/workflows/verify-clean-extraction.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Verify extracted project and remove temporary workflow"
          git push origin "HEAD:$GITHUB_REF_NAME"
